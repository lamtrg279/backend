# 1. Sets the name of your Spring Boot app
spring.application.name=print-ledger

# 2. Points JDBC to PostgreSQL running in Docker (localhost:5432, database 'print-ledger')
spring.datasource.url=jdbc:postgresql://localhost:5432/print-ledger

# 3. Credentials matching POSTGRES_USER and POSTGRES_PASSWORD in your docker-compose.yml
spring.datasource.username=ledger_user
spring.datasource.password=ledger_password
spring.datasource.driver-class-name=org.postgresql.Driver

# 4. Tells Hibernate to automatically build or update database tables from Java @Entity classes
spring.jpa.hibernate.ddl-auto=update

# 5. Formats and prints generated SQL queries to your terminal for easy debugging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect